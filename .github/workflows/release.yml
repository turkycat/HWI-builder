name: Build and Release HWI

# This workflow builds HWI from the official bitcoin-core/HWI repository
# at a specific commit hash. It does NOT build from this repository's code.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 3.1.1)"
        required: true
        type: string
      upstream_commit:
        description: "Commit hash from bitcoin-core/HWI to build"
        required: true
        type: string
        default: "4e342db25d58354cf838734173d2bf195cda32f9"
      create_release:
        description: "Create GitHub release"
        required: true
        type: boolean
        default: true

env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  LANGUAGE: C.UTF-8
  # Upstream repository configuration - explicitly defined
  UPSTREAM_REPO: "bitcoin-core/HWI"
  UPSTREAM_COMMIT: ${{ inputs.upstream_commit || '4e342db25d58354cf838734173d2bf195cda32f9' }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Validate version consistency before building
  validate:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      upstream_commit: ${{ steps.get_version.outputs.upstream_commit }}
    steps:
      - name: Checkout upstream HWI repository
        uses: actions/checkout@v4
        with:
          repository: bitcoin-core/HWI
          ref: ${{ env.UPSTREAM_COMMIT }}

      - name: Get version and commit info
        id: get_version
        run: |
          VERSION="${{ inputs.version }}"
          COMMIT="${{ env.UPSTREAM_COMMIT }}"

          # Read original version from source for informational purposes
          SOURCE_VERSION=$(grep -Po '(?<=^version = ")[^"]*' pyproject.toml)

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "upstream_commit=$COMMIT" >> $GITHUB_OUTPUT

          echo "=========================================="
          echo "Release version: $VERSION"
          echo "Source version (will be patched): $SOURCE_VERSION"
          echo "From upstream commit: $COMMIT"
          echo "Upstream repository: ${{ env.UPSTREAM_REPO }}"
          echo "=========================================="

  # Build Linux x86_64 binaries and Python distributions
  build-linux:
    name: Build Linux x86_64
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream HWI repository
        uses: actions/checkout@v4
        with:
          repository: bitcoin-core/HWI
          ref: ${{ needs.validate.outputs.upstream_commit }}

      - name: Patch version for release
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          echo "Patching version to $VERSION"
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          sed -i "s/__version__ = .*/__version__ = \"$VERSION\"/" hwilib/__init__.py
          echo "=== Patched pyproject.toml ==="
          grep "^version" pyproject.toml
          echo "=== Patched hwilib/__init__.py ==="
          grep "__version__" hwilib/__init__.py

      - name: Build Docker image
        run: |
          docker build --no-cache -t hwi-builder -f contrib/build.Dockerfile .

      - name: Build binaries and distributions
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/opt/hwi \
            --workdir /opt/hwi \
            hwi-builder \
            /bin/bash -c "contrib/build_bin.sh && contrib/build_dist.sh"

      - name: List build artifacts
        run: |
          echo "=== dist/ contents ==="
          ls -la dist/
          echo ""
          echo "=== Artifact details ==="
          find dist/ -type f -exec sha256sum {} \;

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-artifacts
          path: |
            dist/hwi-*-linux-*.tar.gz
          retention-days: 5

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist-artifacts
          path: |
            dist/*.whl
            dist/hwi-*.tar.gz
            !dist/hwi-*-linux-*.tar.gz
            !dist/hwi-*-windows-*.zip
          retention-days: 5

  # Build Linux ARM64 binaries (without GUI)
  build-linux-arm64:
    name: Build Linux ARM64
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream HWI repository
        uses: actions/checkout@v4
        with:
          repository: bitcoin-core/HWI
          ref: ${{ needs.validate.outputs.upstream_commit }}

      - name: Patch version for release
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          echo "Patching version to $VERSION"
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          sed -i "s/__version__ = .*/__version__ = \"$VERSION\"/" hwilib/__init__.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 Docker image
        run: |
          docker buildx build \
            --no-cache \
            --platform linux/arm64 \
            --load \
            -t hwi-builder-arm64 \
            -f contrib/build.Dockerfile .

      - name: Build ARM64 binaries
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v ${{ github.workspace }}:/opt/hwi \
            --workdir /opt/hwi \
            hwi-builder-arm64 \
            /bin/bash -c "contrib/build_bin.sh --without-gui"

      - name: List build artifacts
        run: |
          echo "=== dist/ contents ==="
          ls -la dist/
          echo ""
          echo "=== Artifact details ==="
          find dist/ -type f -name "*arm*" -exec sha256sum {} \;

      - name: Upload ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-artifacts
          path: |
            dist/hwi-*-linux-*.tar.gz
          retention-days: 5

  # Build macOS x86_64 binaries (Intel)
  build-macos-intel:
    name: Build macOS x86_64
    needs: validate
    runs-on: macos-15-intel
    env:
      PYTHON_VERSION: "3.9.19"
    steps:
      - name: Checkout upstream HWI repository
        uses: actions/checkout@v4
        with:
          repository: bitcoin-core/HWI
          ref: ${{ needs.validate.outputs.upstream_commit }}

      - name: Patch version for release
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          echo "Patching version to $VERSION"
          sed -i '' "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          sed -i '' "s/__version__ = .*/__version__ = \"$VERSION\"/" hwilib/__init__.py

      - name: Install dependencies
        run: |
          brew install pyenv
          # Install libusb only if not already present
          brew list libusb &>/dev/null || brew install libusb

      - name: Setup pyenv and install Python
        run: |
          echo 'export PYENV_ROOT="$HOME/.pyenv"' >> ~/.bash_profile
          echo 'export PATH="$PYENV_ROOT/bin:$PATH"' >> ~/.bash_profile
          echo 'eval "$(pyenv init --path)"' >> ~/.bash_profile
          echo 'eval "$(pyenv virtualenv-init -)"' >> ~/.bash_profile
          source ~/.bash_profile

          # Install Python with the reproducible patch
          cat contrib/reproducible-python.diff | \
            PYTHON_CONFIGURE_OPTS="--enable-framework" \
            BUILD_DATE="Jan  1 2019" \
            BUILD_TIME="00:00:00" \
            pyenv install -kp ${{ env.PYTHON_VERSION }}

          pyenv global ${{ env.PYTHON_VERSION }}

      - name: Build macOS binaries
        run: |
          source ~/.bash_profile
          eval "$(pyenv init --path)"
          eval "$(pyenv virtualenv-init -)"
          contrib/build_bin.sh --with-gui

      - name: List build artifacts
        run: |
          echo "=== dist/ contents ==="
          ls -la dist/
          echo ""
          echo "=== Artifact details ==="
          find dist/ -type f -name "*mac*" -exec shasum -a 256 {} \;

      - name: Upload macOS Intel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-artifacts
          path: |
            dist/hwi-*-mac-*.tar.gz
          retention-days: 5

  # Build macOS ARM64 binaries (Apple Silicon)
  build-macos-arm:
    name: Build macOS ARM64
    needs: validate
    runs-on: macos-15
    env:
      PYTHON_VERSION: "3.9.19"
    steps:
      - name: Checkout upstream HWI repository
        uses: actions/checkout@v4
        with:
          repository: bitcoin-core/HWI
          ref: ${{ needs.validate.outputs.upstream_commit }}

      - name: Patch version for release
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          echo "Patching version to $VERSION"
          sed -i '' "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          sed -i '' "s/__version__ = .*/__version__ = \"$VERSION\"/" hwilib/__init__.py

      - name: Install dependencies
        run: |
          brew install pyenv
          # libusb is pre-installed on macos-15 ARM runners
          brew list libusb &>/dev/null || brew install libusb

      - name: Setup pyenv and install Python
        run: |
          echo 'export PYENV_ROOT="$HOME/.pyenv"' >> ~/.zshrc
          echo 'export PATH="$PYENV_ROOT/bin:$PATH"' >> ~/.zshrc
          echo 'eval "$(pyenv init --path)"' >> ~/.zshrc
          echo 'eval "$(pyenv virtualenv-init -)"' >> ~/.zshrc
          source ~/.zshrc

          # Install Python with the reproducible patch
          cat contrib/reproducible-python.diff | \
            PYTHON_CONFIGURE_OPTS="--enable-framework" \
            BUILD_DATE="Jan  1 2019" \
            BUILD_TIME="00:00:00" \
            pyenv install -kp ${{ env.PYTHON_VERSION }}

          pyenv global ${{ env.PYTHON_VERSION }}

      - name: Build macOS binaries
        run: |
          source ~/.zshrc
          eval "$(pyenv init --path)"
          eval "$(pyenv virtualenv-init -)"
          # ARM64 builds without GUI (Qt not supported)
          contrib/build_bin.sh --without-gui

      - name: List build artifacts
        run: |
          echo "=== dist/ contents ==="
          ls -la dist/
          echo ""
          echo "=== Artifact details ==="
          find dist/ -type f -name "*mac*" -exec shasum -a 256 {} \;

      - name: Upload macOS ARM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-artifacts
          path: |
            dist/hwi-*-mac-*.tar.gz
          retention-days: 5

  # Build Windows binaries using Wine
  build-windows:
    name: Build Windows x86_64
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream HWI repository
        uses: actions/checkout@v4
        with:
          repository: bitcoin-core/HWI
          ref: ${{ needs.validate.outputs.upstream_commit }}

      - name: Patch version for release
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          echo "Patching version to $VERSION"
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          sed -i "s/__version__ = .*/__version__ = \"$VERSION\"/" hwilib/__init__.py

      - name: Build Wine Docker image
        run: |
          docker build --no-cache -t hwi-wine-builder -f contrib/build-wine.Dockerfile .

      - name: Build Windows binaries
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/opt/hwi \
            --workdir /opt/hwi \
            hwi-wine-builder \
            /bin/bash -c "contrib/build_wine.sh"

      - name: List build artifacts
        run: |
          echo "=== dist/ contents ==="
          ls -la dist/
          echo ""
          echo "=== Artifact details ==="
          find dist/ -type f -name "*windows*" -exec sha256sum {} \;

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-artifacts
          path: |
            dist/hwi-*-windows-*.zip
          retention-days: 5

  # Generate checksums, attest artifacts, and create release
  release:
    name: Create Release
    needs:
      [
        validate,
        build-linux,
        build-linux-arm64,
        build-macos-intel,
        build-macos-arm,
        build-windows,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.whl" \) -exec cp {} release/ \;
          echo "=== Release artifacts ==="
          ls -la release/

      - name: Generate SHA256SUMS
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: Attest Linux x86_64 binary
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/hwi-*-linux-x86_64.tar.gz

      - name: Attest Linux ARM64 binary
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/hwi-*-linux-aarch64.tar.gz

      - name: Attest macOS Intel binary
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/hwi-*-mac-x86_64.tar.gz

      - name: Attest macOS ARM binary
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/hwi-*-mac-arm64.tar.gz

      - name: Attest Windows binary
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/hwi-*-windows-x86_64.zip

      - name: Attest Python wheel
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*.whl

      - name: Attest Python sdist
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/hwi-${{ needs.validate.outputs.version }}.tar.gz

      - name: Attest SHA256SUMS
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/SHA256SUMS.txt

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          UPSTREAM_COMMIT="${{ needs.validate.outputs.upstream_commit }}"

          cat << EOF > release_notes.md
          ## HWI $VERSION

          Hardware Wallet Interface - command line tool and Python library for interacting with hardware wallets.

          ### Source Information

          > **This release was built from the official [bitcoin-core/HWI](https://github.com/bitcoin-core/HWI) repository.**

          - **Version:** $VERSION
          - **Upstream Repository:** [bitcoin-core/HWI](https://github.com/bitcoin-core/HWI)
          - **Upstream Commit:** [\`${UPSTREAM_COMMIT:0:7}\`](https://github.com/bitcoin-core/HWI/commit/$UPSTREAM_COMMIT)
          - **Build date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          ### Artifacts

          | Platform | Architecture | GUI | File |
          |----------|--------------|-----|------|
          | Linux | x86_64 | ✅ | \`hwi-$VERSION-linux-x86_64.tar.gz\` |
          | Linux | aarch64 | ❌ | \`hwi-$VERSION-linux-aarch64.tar.gz\` |
          | macOS | x86_64 (Intel) | ✅ | \`hwi-$VERSION-mac-x86_64.tar.gz\` |
          | macOS | arm64 (Apple Silicon) | ❌ | \`hwi-$VERSION-mac-arm64.tar.gz\` |
          | Windows | x86_64 | ✅ | \`hwi-$VERSION-windows-x86_64.zip\` |
          | Python | any | ✅ | \`hwi-$VERSION-py3-none-any.whl\` |

          ### Verification

          This release uses [artifact attestations](https://docs.github.com/en/actions/security-for-github-actions/using-artifact-attestations/using-artifact-attestations-to-establish-provenance-for-builds) to provide cryptographic proof of build provenance.

          **Download artifacts first**, either from the GitHub release page or via CLI:
          \`\`\`bash
          # Download a specific asset
          gh release download $VERSION --repo ${{ github.repository }} --pattern 'hwi-*-linux-x86_64.tar.gz'

          # Or download all assets
          gh release download $VERSION --repo ${{ github.repository }}
          \`\`\`

          **Verify Artifact Attestations:**
          \`\`\`bash
          # Verify build provenance attestation for a specific artifact
          gh attestation verify hwi-$VERSION-linux-x86_64.tar.gz --repo ${{ github.repository }}

          # Or verify all downloaded assets
          for f in hwi-$VERSION* SHA256SUMS.txt; do gh attestation verify "\$f" --repo ${{ github.repository }}; done

          # Successful verification confirms:
          # - The artifact was built by GitHub Actions in this repository
          # - The source was checked out from bitcoin-core/HWI at commit $UPSTREAM_COMMIT
          # - The artifact has not been modified since the build
          \`\`\`

          **SHA256 Checksums:**
          \`\`\`bash
          # Download SHA256SUMS.txt and verify file integrity
          sha256sum -c SHA256SUMS.txt
          \`\`\`

          ### Why This Repository?

          The official [bitcoin-core/HWI](https://github.com/bitcoin-core/HWI) repository does not have automated releases.
          This repository provides automated builds with cryptographic attestations, building directly from the official
          upstream source code at a specific, auditable commit.
          EOF

          echo "Generated release notes"

      - name: Create GitHub Release
        if: inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          name: HWI ${{ needs.validate.outputs.version }}
          body_path: release_notes.md
          fail_on_unmatched_files: true
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts (without creating release)
        if: "!inputs.create_release"
        uses: actions/upload-artifact@v4
        with:
          name: all-release-artifacts
          path: release/
          retention-days: 30
